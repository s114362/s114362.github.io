<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulls and Cows</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f5f5;
}
.container {
  margin-top: 50px;
}
input {
  padding: 10px;
  font-size: 18px;
  width: 140px;
  text-align: center;
}
button {
  padding: 10px 15px;
  font-size: 18px;
  margin-left: 10px;
  cursor: pointer;
}
#log {
  margin-top: 20px;
}
.item {
  background: white;
  margin: 5px auto;
  padding: 10px;
  width: 220px;
  border-radius: 8px;
}
#win {
  color: green;
  display: none;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <h1>猜數字</h1>
  <h2 id="win">🎉 答對了！</h2>
  <input id="guess" maxlength="4" placeholder="輸入4位不重複數字">
  <button onclick="check()">猜！</button>
  <button onclick="resetGame()">重置</button>
  <div id="log"></div>
</div>

<script>
let answer = generate();
console.log("答案:", answer);

function generate() {
  let nums = [];
  while (nums.length < 4) {
    let n = Math.floor(Math.random() * 10).toString();
    if (!nums.includes(n)) nums.push(n);
  }
  return nums.join("");
}

function check() {
  let input = document.getElementById("guess");
  let g = input.value;

  if (!/^\d{4}$/.test(g)) {
    alert("請輸入4位數字");
    return;
  }

  if (new Set(g).size !== 4) {
    alert("不能有重複數字");
    return;
  }

  let A = 0, B = 0;

  let usedAnswer = [false, false, false, false];
  let usedGuess = [false, false, false, false];

  for (let i = 0; i < 4; i++) {
    if (g[i] === answer[i]) {
      A++;
      usedAnswer[i] = true;
      usedGuess[i] = true;
    }
  }

  for (let i = 0; i < 4; i++) {
    if (usedGuess[i]) continue;

    for (let j = 0; j < 4; j++) {
      if (usedAnswer[j]) continue;

      if (g[i] === answer[j]) {
        B++;
        usedAnswer[j] = true;
        break;
      }
    }
  }

  let div = document.createElement("div");
  div.className = "item";
  div.innerText = `${g} → ${A}A${B}B`;
  document.getElementById("log").prepend(div);

  if (A === 4) {
    document.getElementById("win").style.display = "block";
  }

  input.value = "";
  input.focus();
}
  function resetGame() {
  answer = generate();
  console.log("新答案:", answer);

  document.getElementById("log").innerHTML = "";
  document.getElementById("guess").value = "";
  document.getElementById("guess").focus();

  document.getElementById("win").style.display = "none";
}
